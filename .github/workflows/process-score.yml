name: Process Leaderboard Score

# Turns "[SCORE] ..." issues (created by the Cloudflare Worker) into entries in scores.json.
# Put this file at .github/workflows/process-score.yml and start with scores.json = {"updated": null, "boards": {}}.
#
# Settings you may want to change when the game's scoring changes:
#   ALLOWED_MODES   comma list of accepted mode names (the game sends "strict" and "original"); leave empty to accept any mode
#   MAX_SCORE       highest score accepted (a sanity limit, not a rule)
#   TOP_N           entries kept per mode
#   ALLOWED_AUTHORS who may create score issues: the account that owns the Worker's token. Anyone else's [SCORE] issue is ignored,
#                   so people can't bypass the Worker by opening issues by hand. Empty = anyone (not recommended).
# Any extra "**Label:** value" lines in the issue body are stored under "extra" automatically.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: leaderboard-processing
  cancel-in-progress: false

env:
  ALLOWED_MODES: "strict,original"
  MAX_SCORE: "1000000"
  TOP_N: "100"
  ALLOWED_AUTHORS: ${{ github.repository_owner }}

jobs:
  process-score:
    if: startsWith(github.event.issue.title, '[SCORE]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Process score
        id: score
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED: ${{ github.event.issue.created_at }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from datetime import datetime, timezone
          from pathlib import Path

          def out(**kw):
              text = "".join(f"{k}={v}\n" for k, v in kw.items())
              p = os.environ.get("GITHUB_OUTPUT")
              if p:
                  with open(p, "a", encoding="utf-8") as f: f.write(text)
              else:
                  print(text)

          def env_list(name):
              return [x.strip() for x in os.environ.get(name, "").split(",") if x.strip()]

          TOP_N = int(os.environ.get("TOP_N") or 100)
          MAX_SCORE = int(os.environ.get("MAX_SCORE") or 1000000)
          ALLOWED_MODES = [m.lower() for m in env_list("ALLOWED_MODES")]      # empty = accept any mode name
          ALLOWED_AUTHORS = [a.lower() for a in env_list("ALLOWED_AUTHORS")]  # who may create score issues (the Worker's token owner)
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "") or ""
          author = os.environ.get("ISSUE_AUTHOR", "")
          number = os.environ.get("ISSUE_NUMBER", "0")
          created = os.environ.get("ISSUE_CREATED") or datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def reject(reason, mode=""):
              print("Rejected:", reason)
              out(result="rejected", reason=reason, rank="", mode=mode)
              sys.exit(0)

          # only issues made through the Worker's token count; anyone else's [SCORE] issue is ignored
          if ALLOWED_AUTHORS and author.lower() not in ALLOWED_AUTHORS:
              print(f"Ignoring issue from {author!r}")
              out(result="ignored", reason="", rank="", mode="")
              sys.exit(0)

          # body fields: lines like  **Name:** value   (case-insensitive labels, values may be wrapped in backticks)
          fields = {}
          for m in re.finditer(r"^\*\*([^:*\n]{1,40}):\*\*[ \t]*(.+?)[ \t]*$", body, re.MULTILINE):
              fields.setdefault(m.group(1).strip().lower(), m.group(2).strip().strip("`").strip())

          # title:  [SCORE] <mode> - <score> - <id>   (optional: the body is enough)
          tm = re.match(r"^\[SCORE\]\s+(\S+)\s+-\s+(\d+)\s+-\s+([A-Za-z0-9._-]+)\s*$", title)
          t_mode, t_score, t_id = (tm.group(1), tm.group(2), tm.group(3)) if tm else (None, None, None)

          name = " ".join((fields.get("name") or "").split())
          mode = (fields.get("mode") or t_mode or "").strip().lower()
          score_s = (fields.get("score") or t_score or "").replace(",", "").strip()
          sid = (fields.get("submission id") or fields.get("submission_id") or t_id or f"issue-{number}").strip()

          if tm:
              if fields.get("mode") and fields["mode"].lower() != t_mode.lower(): reject("title and body disagree about the mode", mode)
              if fields.get("score") and fields["score"].replace(",", "") != t_score: reject("title and body disagree about the score", mode)
          if not re.fullmatch(r"[A-Za-z0-9 _.\-]{1,20}", name): reject("invalid name (1-20 characters: letters, digits, space, _ . -)", mode)
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]{0,23}", mode): reject("invalid mode name", mode)
          if ALLOWED_MODES and mode not in ALLOWED_MODES: reject(f"unknown mode '{mode}'", mode)
          if not re.fullmatch(r"\d{1,12}", score_s): reject("score must be a whole number", mode)
          score = int(score_s)
          if score < 1 or score > MAX_SCORE: reject(f"score out of range (1 to {MAX_SCORE})", mode)
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", sid): reject("invalid submission id", mode)

          # any other **Label:** value lines (wpm, accuracy, version ...) are kept as-is, so new fields need no change here
          extra = {}
          for k, v in fields.items():
              if k in ("name", "mode", "score", "submission id", "submission_id"): continue
              key = re.sub(r"[^a-z0-9]+", "_", k).strip("_")[:24]
              val = "".join(ch for ch in v if ch >= " ")[:64]
              if key and val and len(extra) < 12: extra[key] = val

          path = Path("scores.json")
          boards = {}
          if path.exists():
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  src = data.get("boards") if isinstance(data, dict) and isinstance(data.get("boards"), dict) else data
                  if isinstance(src, dict):
                      boards = {k: [e for e in v if isinstance(e, dict)] for k, v in src.items() if isinstance(v, list)}
              except Exception as e:
                  print("scores.json unreadable, starting fresh:", e)

          for rows in boards.values():
              for e in rows:
                  if e.get("id") == sid or e.get("submission_id") == sid:
                      print("Duplicate submission.")
                      out(result="duplicate", reason="", rank="", mode=mode)
                      sys.exit(0)

          entry = {"name": name, "score": score, "id": sid, "date": created}
          if extra: entry["extra"] = extra
          rows = boards.setdefault(mode, [])
          rows.append(entry)
          rows.sort(key=lambda e: (-int(e.get("score", 0)), str(e.get("date", "")), str(e.get("id", ""))))
          boards[mode] = rows = rows[:TOP_N]
          rank = next((i + 1 for i, e in enumerate(rows) if e.get("id") == sid), None)

          path.write_text(json.dumps({"updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "boards": boards}, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"{mode}: {name} {score} -> rank {rank}")
          out(result="accepted" if rank else "not_top", reason="", rank=rank or "", mode=mode)
          PY

      - name: Commit leaderboard
        if: steps.score.outputs.result == 'accepted' || steps.score.outputs.result == 'not_top'
        run: |
          git config user.name "Dungeon Typer Leaderboard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.json
          if git diff --cached --quiet; then
            echo "No leaderboard changes."
            exit 0
          fi
          git commit -m "Update leaderboard"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
          done
          exit 1

      - name: Comment and close issue
        if: steps.score.outputs.result != '' && steps.score.outputs.result != 'ignored'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.score.outputs.result }}
          RANK: ${{ steps.score.outputs.rank }}
          MODE: ${{ steps.score.outputs.mode }}
          REASON: ${{ steps.score.outputs.reason }}
        run: |
          case "$RESULT" in
            accepted)  MESSAGE="Score accepted for **$MODE**. Current rank: **#$RANK**." ;;
            not_top)   MESSAGE="Score received, but it did not make the top $TOP_N for **$MODE**." ;;
            duplicate) MESSAGE="This score submission was already processed." ;;
            rejected)  MESSAGE="Score rejected: $REASON." ;;
            *)         MESSAGE="Score processing finished." ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
          gh issue close "$ISSUE_NUMBER"
